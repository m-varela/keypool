# Mesclar este fragmento em configs/providers.yaml do Mathlab.
# O Mathlab guarda somente a API key kp_... do KeyPool, nunca chaves upstream.
providers:
  keypool:
    type: openai_compatible
    env_prefix: KEYPOOL
    base_url: http://127.0.0.1:8787/v1
    timeout_s: 600
    headers:
      X-Keypool-Project: mathlab
    limit_scope: provider
    limits: {}

default_provider: keypool
